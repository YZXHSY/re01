<!doctype html>
<html lang="ch-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #4bc0c8, #c779d0, #feac5e);
      }
      .box {
        height: 80vh;
        width: 60vh;
        display: flex;
        max-width: 600px;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 30px;
        background-color: #fff;
        color: #333;
        font-size: large;
        overflow-y: scroll;
        flex-direction: column;
        line-height: 1.7;
        font-family: "思源黑体";
        overflow-wrap: break-word;
        word-wrap: break-word;
      }
      .box::-webkit-scrollbar {
        display: none; /* Chrome Safari */
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p>列位诸公，随我征战</p>
      <p>我打了一辈子仗，就不能享受享受吗？</p>
      <p>接着奏乐，接着舞！</p>
      <p>吃什么</p>
      <p>是啊，吃什么</p>
      <p>八万个馒头</p>
      <p>好啊，你吃馒头我也吃馒头</p>
      <p>不可能，绝对不可能</p>
      <p>咱家说了，咱家不怕酸</p>
      <p>孔明号卧龙</p>
      <p>龙，可是帝王之征啊！</p>
      <p>赵云字子龙</p>
      <p>龙，可是帝王之征啊！</p>
      <p>某刀号青龙</p>
      <p>龙，可是帝王之征啊！</p>
    </div>
  </body>
</html>
