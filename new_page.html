<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工具箱</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .add-form {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .add-form input {
        flex: 1;
        min-width: 200px;
        padding: 12px 16px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }
      .add-form input:focus {
        border-color: var(--primary);
      }
      .add-form button {
        padding: 12px 24px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s;
      }
      .add-form button:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }
      .link-list {
        list-style: none;
      }
      .link-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: rgba(26, 26, 46, 0.4);
        border-radius: 8px;
        margin-bottom: 8px;
        transition: all 0.3s;
      }
      .link-item:hover {
        background: rgba(26, 26, 46, 0.7);
      }
      .link-item a {
        color: var(--text);
        text-decoration: none;
        flex: 1;
        word-break: break-all;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .link-item a:hover {
        color: var(--primary);
      }
      .link-item .delete-btn {
        padding: 6px 12px;
        background: #ff4757;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        opacity: 0;
        transition: all 0.3s;
      }
      .link-item:hover .delete-btn {
        opacity: 1;
      }
      .link-item .delete-btn:hover {
        background: #ff6b7a;
      }
      .category-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .category-header h3 {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .empty-state {
        text-align: center;
        color: var(--text-light);
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a href="index.html" class="logo">🛠️ 工具箱</a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">首页</a>
          <a href="start.html" class="nav-link">任务管理</a>
          <a href="deadline.html" class="nav-link">Deadline</a>
          <a href="game.html" class="nav-link">游戏</a>
          <a href="new_page.html" class="nav-link active">工具箱</a>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <div class="container">
        <div class="hero">
          <h1>常用工具</h1>
          <p>快速访问常用网站和工具</p>
        </div>

        <h2 class="section-title">🔧 实用工具</h2>
        <div class="cards-grid">
          <a href="https://github.com" target="_blank" class="card">
            <div class="card-icon">🐙</div>
            <div class="card-title">GitHub</div>
            <div class="card-desc">代码托管平台</div>
          </a>
          <a href="https://stackoverflow.com" target="_blank" class="card">
            <div class="card-icon">💬</div>
            <div class="card-title">Stack Overflow</div>
            <div class="card-desc">技术问答社区</div>
          </a>
          <a href="https://www.google.com" target="_blank" class="card">
            <div class="card-icon">🔍</div>
            <div class="card-title">Google</div>
            <div class="card-desc">搜索引擎</div>
          </a>
          <a href="https://www.bilibili.com" target="_blank" class="card">
            <div class="card-icon">📺</div>
            <div class="card-title">哔哩哔哩</div>
            <div class="card-desc">视频弹幕网站</div>
          </a>
          <a href="https://www.zhihu.com" target="_blank" class="card">
            <div class="card-icon">💡</div>
            <div class="card-title">知乎</div>
            <div class="card-desc">问答社区</div>
          </a>
          <a href="https://web.telegram.org" target="_blank" class="card">
            <div class="card-icon">✈️</div>
            <div class="card-title">Telegram</div>
            <div class="card-desc">即时通讯</div>
          </a>
        </div>

        <h2 class="section-title">📁 我的收藏</h2>
        
        <div class="add-form">
          <input type="text" id="linkTitle" placeholder="网站名称（可选）">
          <input type="url" id="linkUrl" placeholder="输入网址，如 https://..." required>
          <button onclick="addLink()">添加收藏</button>
        </div>

        <div class="info-grid" id="collectionsGrid"></div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2024 工具箱 · 基于 GitHub Pages 构建</p>
      </div>
    </footer>

    <script>
      let collections = JSON.parse(localStorage.getItem('collections')) || {
        '💻 开发工具': [],
        '📚 学习资源': [],
        '☁️ 云服务': [],
        '🎨 设计资源': []
      };

      function saveCollections() {
        localStorage.setItem('collections', JSON.stringify(collections));
      }

      function addLink() {
        const titleInput = document.getElementById('linkTitle');
        const urlInput = document.getElementById('linkUrl');
        const title = titleInput.value.trim();
        const url = urlInput.value.trim();

        if (!url) {
          alert('请输入网址');
          return;
        }

        let finalUrl = url;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          finalUrl = 'https://' + url;
        }

        const defaultTitles = {
          'github.com': 'GitHub',
          'stackoverflow.com': 'Stack Overflow',
          'google.com': 'Google',
          'bilibili.com': '哔哩哔哩',
          'zhihu.com': '知乎',
          'youtube.com': 'YouTube',
          'douban.com': '豆瓣'
        };

        let displayTitle = title;
        if (!displayTitle) {
          for (const key in defaultTitles) {
            if (finalUrl.includes(key)) {
              displayTitle = defaultTitles[key];
              break;
            }
          }
        }
        if (!displayTitle) {
          displayTitle = finalUrl.replace(/^https?:\/\//, '').split('/')[0];
        }

        const defaultCategory = '📚 学习资源';
        if (!collections[defaultCategory]) {
          collections[defaultCategory] = [];
        }
        
        collections[defaultCategory].push({
          id: Date.now(),
          title: displayTitle,
          url: finalUrl
        });

        titleInput.value = '';
        urlInput.value = '';
        saveCollections();
        renderCollections();
      }

      function deleteLink(category, id) {
        collections[category] = collections[category].filter(link => link.id !== id);
        saveCollections();
        renderCollections();
      }

      function renderCollections() {
        const grid = document.getElementById('collectionsGrid');
        let html = '';

        for (const [category, links] of Object.entries(collections)) {
          if (links.length === 0) continue;

          html += `
            <div class="info-card">
              <div class="category-header">
                <h3>${category}</h3>
              </div>
              <ul class="link-list">
                ${links.map(link => `
                  <li class="link-item">
                    <a href="${link.url}" target="_blank" title="${link.url}">
                      🔗 ${link.title}
                    </a>
                    <button class="delete-btn" onclick="deleteLink('${category}', ${link.id})">删除</button>
                  </li>
                `).join('')}
              </ul>
            </div>
          `;
        }

        if (!html) {
          html = '<div class="empty-state">暂无收藏，点击上方添加按钮添加网站</div>';
        }

        grid.innerHTML = html;
      }

      document.getElementById('linkUrl').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          addLink();
        }
      });

      renderCollections();
    </script>
  </body>
</html>
