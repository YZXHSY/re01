<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎮 贪吃蛇</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .container {
        background: #0f0f23;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      h1 {
        color: #eee;
        text-align: center;
        margin-bottom: 16px;
        font-size: 28px;
        text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
      }
      .score-board {
        display: flex;
        justify-content: space-around;
        margin-bottom: 16px;
      }
      .score-item {
        color: #888;
        font-size: 16px;
      }
      .score-item span {
        color: #00ff88;
        font-weight: bold;
        font-size: 20px;
        margin-left: 8px;
      }
      #gameCanvas {
        display: block;
        margin: 0 auto 16px;
        border: 3px solid #00ff88;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        touch-action: none;
      }
      .controls {
        color: #666;
        text-align: center;
        font-size: 14px;
        margin-bottom: 16px;
      }
      .controls span {
        color: #00ff88;
      }
      .buttons {
        display: flex;
        justify-content: center;
        gap: 16px;
      }
      button {
        padding: 10px 24px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-restart {
        background: #00ff88;
        color: #0f0f23;
      }
      .btn-restart:hover {
        background: #00cc6a;
        transform: translateY(-2px);
      }
      .btn-back {
        background: #333;
        color: #eee;
      }
      .btn-back:hover {
        background: #444;
        transform: translateY(-2px);
      }
      #gameOver {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 15, 35, 0.95);
        padding: 32px 48px;
        border-radius: 16px;
        text-align: center;
        border: 2px solid #ff4757;
        z-index: 100;
      }
      #gameOver h2 {
        color: #ff4757;
        font-size: 32px;
        margin-bottom: 16px;
      }
      #gameOver p {
        color: #888;
        margin-bottom: 24px;
      }
      @media (orientation: landscape) and (max-width: 768px) {
        .container {
          transform: scale(0.85);
          padding: 16px;
        }
        h1 {
          font-size: 22px;
          margin-bottom: 12px;
        }
        .score-board {
          margin-bottom: 12px;
        }
        .score-item {
          font-size: 14px;
        }
        .score-item span {
          font-size: 16px;
        }
        #gameCanvas {
          margin-bottom: 12px;
        }
        .controls {
          font-size: 12px;
          margin-bottom: 12px;
        }
        button {
          padding: 8px 16px;
          font-size: 14px;
        }
      }
      @media (max-width: 400px) {
        .container {
          transform: scale(0.75);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎮 贪吃蛇</h1>
      <div class="score-board">
        <div class="score-item">得分<span id="score">0</span></div>
        <div class="score-item">最高分<span id="highScore">0</span></div>
      </div>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="controls">
        <span>↑ ↓ ← →</span> 方向键控制 &nbsp;|&nbsp; <span>空格</span> 暂停
      </div>
      <div class="buttons">
        <button class="btn-restart" onclick="restartGame()">重新开始</button>
        <button class="btn-back" onclick="location.href='index.html'">返回主页</button>
      </div>
      <div id="gameOver">
        <h2>游戏结束</h2>
        <p>得分: <span id="finalScore">0</span></p>
        <button class="btn-restart" onclick="restartGame()">再来一局</button>
      </div>
    </div>
    <script src="snake.js"></script>
  </body>
</html>
