<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎮 贪吃蛇</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .container {
        background: #0f0f23;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      h1 {
        color: #eee;
        text-align: center;
        margin-bottom: 16px;
        font-size: 28px;
        text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
      }
      .score-board {
        display: flex;
        justify-content: space-around;
        margin-bottom: 16px;
      }
      .score-item {
        color: #888;
        font-size: 16px;
      }
      .score-item span {
        color: #00ff88;
        font-weight: bold;
        font-size: 20px;
        margin-left: 8px;
      }
      #gameCanvas {
        display: block;
        margin: 0 auto 16px;
        border: 3px solid #00ff88;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        touch-action: none;
      }
      .controls {
        color: #666;
        text-align: center;
        font-size: 14px;
        margin-bottom: 16px;
      }
      .controls span {
        color: #00ff88;
      }
      .buttons {
        display: flex;
        justify-content: center;
        gap: 16px;
      }
      button {
        padding: 10px 24px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-restart {
        background: #00ff88;
        color: #0f0f23;
      }
      .btn-restart:hover {
        background: #00cc6a;
        transform: translateY(-2px);
      }
      .btn-back {
        background: #333;
        color: #eee;
      }
      .btn-back:hover {
        background: #444;
        transform: translateY(-2px);
      }
      #gameOver {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 15, 35, 0.95);
        padding: 32px 48px;
        border-radius: 16px;
        text-align: center;
        border: 2px solid #ff4757;
        z-index: 100;
      }
      #gameOver h2 {
        color: #ff4757;
        font-size: 32px;
        margin-bottom: 16px;
      }
      #gameOver p {
        color: #888;
        margin-bottom: 24px;
      }
      #rotateHint {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: #eee;
      }
      #rotateHint.show {
        display: flex;
      }
      .rotate-icon {
        width: 60px;
        height: 60px;
        margin-bottom: 24px;
      }
      .rotate-icon svg {
        width: 100%;
        height: 100%;
        fill: #00ff88;
      }
      .rotate-text {
        font-size: 18px;
        color: #888;
        text-align: center;
      }
      .rotate-text-main {
        font-size: 22px;
        color: #eee;
        margin-bottom: 8px;
      }
      .btn-continue {
        margin-top: 24px;
        padding: 12px 32px;
        background: #00ff88;
        color: #0f0f23;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-continue:hover {
        background: #00cc6a;
        transform: scale(1.05);
      }
      @media (orientation: landscape) and (max-width: 768px) {
        .container {
          transform: scale(0.85);
          padding: 16px;
        }
        h1 {
          font-size: 22px;
          margin-bottom: 12px;
        }
        .score-board {
          margin-bottom: 12px;
        }
        .score-item {
          font-size: 14px;
        }
        .score-item span {
          font-size: 16px;
        }
        #gameCanvas {
          margin-bottom: 12px;
        }
        .controls {
          font-size: 12px;
          margin-bottom: 12px;
        }
        button {
          padding: 8px 16px;
          font-size: 14px;
        }
      }
      @media (max-width: 400px) {
        .container {
          transform: scale(0.75);
        }
      }
    </style>
  </head>
  <body>
    <div id="rotateHint">
      <div class="rotate-icon">
        <svg viewBox="0 0 24 24">
          <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.31.29l-3.81-3.81-.66.66c3.27-1.55 5.61-4.72 5.97-8.48H7.02c-.51 6.16-5.66 11-11.95 11l.66-.03-3.81 3.81 1.33 1.32z"/>
        </svg>
      </div>
      <p class="rotate-text-main">请将手机横屏</p>
      <p class="rotate-text">Rotate your device to landscape</p>
      <button class="btn-continue" onclick="hideRotateHint()">继续游戏</button>
    </div>

    <div class="container">
      <h1>🎮 贪吃蛇</h1>
      <div class="score-board">
        <div class="score-item">得分<span id="score">0</span></div>
        <div class="score-item">最高分<span id="highScore">0</span></div>
      </div>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="controls">
        <span>↑ ↓ ← →</span> 方向键控制 &nbsp;|&nbsp; <span>空格</span> 暂停
      </div>
      <div class="buttons">
        <button class="btn-restart" onclick="restartGame()">重新开始</button>
        <button class="btn-back" onclick="location.href='index.html'">返回主页</button>
      </div>
      <div id="gameOver">
        <h2>游戏结束</h2>
        <p>得分: <span id="finalScore">0</span></p>
        <button class="btn-restart" onclick="restartGame()">再来一局</button>
      </div>
    </div>
    <script src="snake.js"></script>
  </body>
</html>
