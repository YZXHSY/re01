<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人主页</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a href="index.html" class="logo">🐛 一只小函数的小窝</a>
        <div class="nav-links">
          <a href="index.html" class="nav-link active">首页</a>
          <a href="start.html" class="nav-link">任务管理</a>
          <a href="game.html" class="nav-link">游戏</a>
          <a href="new_page.html" class="nav-link">工具箱</a>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <div class="container">
        <div class="hero">
          <img src="mascot.png" alt="吉祥物" class="mascot" />
          <h1>欢迎来到一只小函数的小窝！</h1>
          <p>记录学习、分享代码、享受生活</p>
        </div>

        <h2 class="section-title">🚀 快捷入口</h2>
        <div class="cards-grid">
          <a href="start.html" class="card">
            <div class="card-icon">📋</div>
            <div class="card-title">任务管理</div>
            <div class="card-desc">管理长期目标和每日任务</div>
          </a>
          <a href="game.html" class="card">
            <div class="card-icon">🎮</div>
            <div class="card-title">贪吃蛇游戏</div>
            <div class="card-desc">经典小游戏，放松一下吧</div>
          </a>
          <a href="new_page.html" class="card">
            <div class="card-icon">🛠️</div>
            <div class="card-title">工具箱</div>
            <div class="card-desc">常用工具和链接集合</div>
          </a>
        </div>

        <h2 class="section-title">📊 今日概览</h2>
        <div class="info-grid">
          <div class="info-card">
            <h3>📝 今日任务</h3>
            <p id="todayTask">暂无任务</p>
          </div>
          <div class="info-card">
            <h3>🎯 长期目标进度</h3>
            <p id="goalProgress">暂无目标</p>
          </div>
          <div class="info-card">
            <h3>📅 当前日期</h3>
            <p id="currentDate"></p>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2024 个人主页 · 基于 GitHub Pages 构建</p>
      </div>
    </footer>

    <script>
      const date = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('currentDate').textContent = date.toLocaleDateString('zh-CN', options);

      const tasks = JSON.parse(localStorage.getItem('tasks') || '{}');
      const today = date.toISOString().split('T')[0];
      const todayTasks = tasks[today] || [];
      if (todayTasks.length > 0) {
        const completed = todayTasks.filter(t => t.completed).length;
        document.getElementById('todayTask').textContent = 
          `今日共 ${todayTasks.length} 个任务，已完成 ${completed} 个`;
      }

      const goals = JSON.parse(localStorage.getItem('goals') || '[]');
      if (goals.length > 0) {
        const completed = goals.filter(g => g.completed).length;
        document.getElementById('goalProgress').textContent = 
          `共 ${goals.length} 个目标，已完成 ${completed} 个`;
      }
    </script>
  </body>
</html>
