<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadline 计时器</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .deadline-form {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
        flex-wrap: wrap;
      }
      .deadline-form input {
        padding: 12px 16px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }
      .deadline-form input:focus {
        border-color: var(--primary);
      }
      .deadline-form input[type="text"] {
        flex: 1;
        min-width: 200px;
      }
      .deadline-form input[type="datetime-local"] {
        min-width: 220px;
      }
      .deadline-form button {
        padding: 12px 28px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s;
      }
      .deadline-form button:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      .deadline-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        background: var(--bg-card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 12px;
        transition: all 0.3s;
      }
      .deadline-item:hover {
        box-shadow: var(--shadow-hover);
      }
      .deadline-item.completed {
        opacity: 0.6;
        order: 1;
      }
      .deadline-item.completed .deadline-name {
        text-decoration: line-through;
      }

      .deadline-info {
        flex: 1;
        min-width: 0;
      }
      .deadline-name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .deadline-meta {
        font-size: 13px;
        color: var(--text-light);
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .deadline-countdown {
        font-size: 20px;
        font-weight: bold;
        white-space: nowrap;
        min-width: 140px;
        text-align: center;
      }
      .deadline-countdown.urgent {
        color: #ff4757;
      }
      .deadline-countdown.soon {
        color: #ffa502;
      }
      .deadline-countdown.safe {
        color: #2ed573;
      }
      .deadline-countdown.overdue {
        color: #ff4757;
      }
      .deadline-countdown.done {
        color: var(--text-light);
      }

      .deadline-actions {
        display: flex;
        gap: 8px;
      }
      .deadline-actions button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.3s;
      }
      .btn-complete {
        background: #2ed573;
        color: white;
      }
      .btn-complete:hover {
        background: #26bf62;
      }
      .btn-undo {
        background: #747d8c;
        color: white;
      }
      .btn-undo:hover {
        background: #5f6773;
      }
      .btn-delete {
        background: #ff4757;
        color: white;
      }
      .btn-delete:hover {
        background: #e83e4d;
      }

      .deadline-list {
        display: flex;
        flex-direction: column;
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-light);
      }
      .empty-state .empty-icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      .empty-state p {
        font-size: 16px;
      }

      .section-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-light);
        margin: 24px 0 12px;
        padding-left: 4px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a href="deadline.html" class="logo">⏰ Deadline 计时器</a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">首页</a>
          <a href="start.html" class="nav-link">任务管理</a>
          <a href="deadline.html" class="nav-link active">Deadline</a>
          <a href="game.html" class="nav-link">游戏</a>
          <a href="new_page.html" class="nav-link">工具箱</a>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <div class="container">
        <div class="hero">
          <h1>⏰ Deadline 计时器</h1>
          <p>管理你的截止日期，不再错过任何 DDL</p>
        </div>

        <h2 class="section-title">➕ 添加 DDL</h2>
        <div class="deadline-form">
          <input type="text" id="nameInput" placeholder="DDL 名称（如：交作业）" />
          <input type="datetime-local" id="datetimeInput" />
          <button onclick="addDeadline()">添加</button>
        </div>

        <h2 class="section-title">📋 DDL 列表</h2>
        <div id="deadlineList" class="deadline-list"></div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2024 个人主页 · 基于 GitHub Pages 构建</p>
      </div>
    </footer>

    <script>
      let deadlines = JSON.parse(localStorage.getItem('deadlines') || '[]');
      let timerId = null;

      function saveDeadlines() {
        localStorage.setItem('deadlines', JSON.stringify(deadlines));
      }

      function getCountdownText(dueDate) {
        const now = Date.now();
        const diff = dueDate - now;
        if (diff <= 0) return '已过期';
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        if (days > 0) return `${days}天 ${hours}时 ${minutes}分 ${seconds}秒`;
        if (hours > 0) return `${hours}时 ${minutes}分 ${seconds}秒`;
        if (minutes > 0) return `${minutes}分 ${seconds}秒`;
        return `${seconds}秒`;
      }

      function getCountdownClass(dueDate, completed) {
        if (completed) return 'done';
        const now = Date.now();
        const diff = dueDate - now;
        if (diff <= 0) return 'overdue';
        if (diff <= 3600000) return 'urgent';
        if (diff <= 86400000) return 'soon';
        return 'safe';
      }

      function formatDate(ts) {
        const d = new Date(ts);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${y}-${m}-${day} ${h}:${min}`;
      }

      function render() {
        const list = document.getElementById('deadlineList');

        const active = deadlines.filter(d => !d.completed);
        const done = deadlines.filter(d => d.completed);

        active.sort((a, b) => a.dueDate - b.dueDate);
        done.sort((a, b) => a.dueDate - b.dueDate);

        if (deadlines.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📅</div>
              <p>还没有 DDL，添加一个吧！</p>
            </div>
          `;
          return;
        }

        let html = '';
        if (active.length > 0) {
          html += '<div class="section-label">⏳ 进行中</div>';
          active.forEach(d => {
            html += renderItem(d);
          });
        }
        if (done.length > 0) {
          html += '<div class="section-label">✅ 已完成</div>';
          done.forEach(d => {
            html += renderItem(d);
          });
        }
        list.innerHTML = html;
      }

      function renderItem(d) {
        const cls = getCountdownClass(d.dueDate, d.completed);
        const countdown = d.completed ? '已完成' : getCountdownText(d.dueDate);
        const completedCls = d.completed ? 'completed' : '';
        const actionBtn = d.completed
          ? `<button class="btn-undo" onclick="toggleComplete('${d.id}')">撤销</button>`
          : `<button class="btn-complete" onclick="toggleComplete('${d.id}')">✓ 完成</button>`;

        return `
          <div class="deadline-item ${completedCls}">
            <div class="deadline-info">
              <div class="deadline-name">${escapeHtml(d.name)}</div>
              <div class="deadline-meta">
                <span>📅 ${formatDate(d.dueDate)}</span>
              </div>
            </div>
            <div class="deadline-countdown ${cls}">${countdown}</div>
            <div class="deadline-actions">
              ${actionBtn}
              <button class="btn-delete" onclick="deleteDeadline('${d.id}')">删除</button>
            </div>
          </div>
        `;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function addDeadline() {
        const nameInput = document.getElementById('nameInput');
        const datetimeInput = document.getElementById('datetimeInput');
        const name = nameInput.value.trim();
        const datetime = datetimeInput.value;

        if (!name) { alert('请输入 DDL 名称'); return; }
        if (!datetime) { alert('请选择截止时间'); return; }

        deadlines.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name,
          dueDate: new Date(datetime).getTime(),
          completed: false,
          createdAt: Date.now()
        });

        saveDeadlines();
        nameInput.value = '';
        datetimeInput.value = '';
        render();
      }

      function toggleComplete(id) {
        const d = deadlines.find(d => d.id === id);
        if (d) {
          d.completed = !d.completed;
          saveDeadlines();
          render();
        }
      }

      function deleteDeadline(id) {
        if (!confirm('确定删除这个 DDL 吗？')) return;
        deadlines = deadlines.filter(d => d.id !== id);
        saveDeadlines();
        render();
      }

      function tick() {
        render();
      }

      function startTimer() {
        if (timerId) clearInterval(timerId);
        timerId = setInterval(tick, 1000);
      }

      document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const offset = now.getTimezoneOffset();
        const localISOTime = new Date(now.getTime() - offset * 60000).toISOString();
        document.getElementById('datetimeInput').min = localISOTime.slice(0, 16);
        document.getElementById('datetimeInput').value = localISOTime.slice(0, 16);

        render();
        startTimer();
      });
    </script>
  </body>
</html>
